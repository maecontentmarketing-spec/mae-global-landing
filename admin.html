<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAE GLOBAL 内容编辑后台</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo-group">
      <div class="logo-badge">Logo</div>
      <div class="logo-text">MAE <span>GLOBAL</span></div>
    </div>
    <a href="index.html" class="btn" style="background:#fff;color:var(--purple) !important;border:1px solid var(--purple);">回到网站</a>
  </div>
</header>

<!-- 登入画面 -->
<div class="admin-shell admin-login" id="login-view">
  <h1>MAE GLOBAL 内容编辑后台</h1>
  <p>用你的 admin 帐号登入，登入后可以逐个板块修改文字内容，保存后网站会立即更新。</p>
  <div class="card" style="text-align:left;">
    <div class="admin-field">
      <label>邮箱</label>
      <input type="email" id="login-email">
    </div>
    <div class="admin-field">
      <label>密码</label>
      <input type="password" id="login-password">
    </div>
    <div class="form-msg err" id="login-err" style="display:none;">登入失败，请检查邮箱/密码，或联络开发者确认帐号权限。</div>
    <button class="btn btn-block" id="login-btn">登入</button>
  </div>
</div>

<!-- 编辑画面（登入后显示） -->
<div class="admin-shell" id="editor-view" style="display:none;">
  <div class="admin-topbar">
    <div class="who">已登入：<span id="who-email"></span></div>
    <button class="link-btn" id="logout-btn">登出</button>
  </div>

  <div class="admin-tabs">
    <button class="tab-btn active" data-tab="tab-content">内容 & 排版</button>
    <button class="tab-btn" data-tab="tab-leads">报名数据</button>
    <button class="tab-btn" data-tab="tab-templates">Email 模板</button>
  </div>

  <!-- Tab 1：内容/排版编辑（现有各板块 + 网站排版拖拽卡片，都在 admin.js 里动态生成） -->
  <div class="tab-panel active" id="tab-content">
    <div id="sections"></div>
  </div>

  <!-- Tab 2：报名数据 & Overview -->
  <div class="tab-panel" id="tab-leads">
    <div class="admin-section card">
      <h3>Overview 总览</h3>
      <div class="overview-grid" id="leads-overview"></div>
    </div>

    <div class="admin-section card">
      <h3>报名名单
        <span style="float:right;">
          <button class="link-btn" id="export-csv">导出 CSV</button>
          <button class="link-btn" id="refresh-leads">刷新</button>
        </span>
      </h3>
      <div style="overflow-x:auto;">
        <table class="leads-table" id="leads-table">
          <thead><tr><th>时间</th><th>姓名</th><th>邮箱</th><th>电话</th><th>城市</th><th>代理代码</th><th>来源</th><th>Email</th></tr></thead>
          <tbody id="leads-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Tab 3：Email 模板管理 -->
  <div class="tab-panel" id="tab-templates">
    <div class="admin-section card">
      <h3>Email 模板
        <span style="float:right;">
          <button class="link-btn" id="add-template-btn">+ 新增模板</button>
          <button class="btn save-btn" id="save-templates-btn">保存</button>
        </span>
      </h3>
      <p class="hint">这里管理的模板，会出现在「报名数据」名单里每一行的 Email 下拉选单中。{{name}} 会自动换成该笔报名资料的姓名。</p>
      <div id="templates-list"></div>
      <div class="form-msg ok" id="templates-save-msg" style="margin-top:10px;">已保存。</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/content.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
